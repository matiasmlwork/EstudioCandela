<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F2EC">
<title>Formularios recibidos</title>
<link rel="icon" type="image/png" href="/pdf/isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap">
<style>
:root{color-scheme:light;--crema:#F6F2EC;--papel:#FBF8F3;--carbon:#383A34;--madera:#8A6F55;--madera-osc:#5E4B39;--suave:#6B6258;--tenue:#A39A8E;--linea:#DDD5C8;--arena:#C9BFAF;--sel:#F1E9DE;
  --serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:'Montserrat','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--carbon);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:36px}
header img{width:44px;height:auto}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.32em;text-transform:uppercase;margin:16px 0 0;padding-left:.32em}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,40px);line-height:1.1;margin:28px 0 0}
.sub{color:var(--suave);font-size:13px;margin:8px 0 0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
li{background:var(--papel);border:1px solid var(--linea);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px}
li.nuevo{border-color:var(--madera)}
.info{flex:1;min-width:0}
.nom{font-family:var(--serif);font-size:23px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--suave);margin:4px 0 0}
.est{display:inline-block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--madera);margin-left:8px}
.btn{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;background:var(--madera);color:var(--crema);border-radius:999px;padding:12px 20px;text-decoration:none;white-space:nowrap;border:0;cursor:pointer}
.btn:hover{background:var(--madera-osc)}
.btn.off{background:transparent;color:var(--tenue);border:1px solid var(--linea);cursor:default}
.msg{text-align:center;color:var(--suave);padding:40px 0;font-size:14px}
:focus-visible{outline:2px solid var(--madera);outline-offset:3px;border-radius:8px}
@media(max-width:480px){li{flex-direction:column;align-items:flex-start}.btn{align-self:stretch;text-align:center}}
</style>
</head>
<body>
<main>
  <header>
    <img src="/img/isotipo.webp" alt="Isotipo de Candela Chicco">
    <p class="brand">Candela Chicco</p>
    <h1>Formularios recibidos</h1>
    <p class="sub" id="sub">Conozcamos tu forma de habitar</p>
  </header>
  <ul id="lista"></ul>
  <p class="msg" id="msg">Cargando…</p>
</main>
<script src="/config.js"></script>
<script>
(function(){
  var CFG = window.CC_CONFIG, FN = CFG.supabaseUrl + '/functions/v1/resumenes';
  var k = (location.hash.match(/k=([0-9a-f]+)/) || [])[1];
  try { if (k) localStorage.setItem('cc-panel-k', k); else k = localStorage.getItem('cc-panel-k'); } catch (e) {}
  var lista = document.getElementById('lista'), msg = document.getElementById('msg');
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fecha(s){ var d = new Date(s); return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear()+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') }
  function llamar(body){
    return fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: CFG.supabaseKey, Authorization:'Bearer '+CFG.supabaseKey }, body: JSON.stringify(body) })
      .then(function(r){ if (r.status === 401) throw new Error('auth'); return r.json() });
  }
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
  function cargar(){
    if (!k) { msg.textContent = 'Este link no es válido.'; return }
    llamar({ k: k }).then(function(d){
      var rs = d.respuestas || [];
      msg.hidden = rs.length > 0; msg.textContent = 'Todavía no llegó ningún formulario.';
      var nuevos = rs.filter(function(r){ return r.estado === 'nuevo' }).length;
      document.getElementById('sub').textContent = rs.length + (rs.length === 1 ? ' formulario' : ' formularios') + (nuevos ? ' · ' + nuevos + (nuevos === 1 ? ' nuevo' : ' nuevos') : '');
      lista.replaceChildren.apply(lista, rs.map(function(r){
        var li = el('li', r.estado === 'nuevo' ? 'nuevo' : ''), info = el('div', 'info');
        var nom = el('p', 'nom', r.nombre || 'Sin nombre');
        if (r.estado === 'nuevo') nom.append(el('span', 'est', 'Nuevo'));
        info.append(nom, el('p', 'meta', fecha(r.creado_en) + (r.zona ? ' · ' + r.zona : '')));
        var b;
        if (r.pdf) {
          b = el('a', 'btn', 'Abrir PDF'); b.href = r.pdf; b.target = '_blank'; b.rel = 'noopener';
          b.addEventListener('click', function(){ if (r.estado === 'nuevo') llamar({ k: k, accion: 'visto', id: r.id }).then(cargar, function(){}) });
        } else b = el('span', 'btn off', 'PDF en preparación');
        li.append(info, b); return li;
      }));
    }).catch(function(e){ msg.hidden = false; msg.textContent = e.message === 'auth' ? 'Este link no es válido.' : 'No se pudo cargar. Probá de nuevo en un momento.' });
  }
  cargar();
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') cargar() });
})();
</script>
</body>
</html>
